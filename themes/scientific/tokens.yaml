name: scientific
variant: dark

canvas:
  aspect: "16:9"
  width_px: 1280
  height_px: 720

colors:
  background: "#1a1a2e"
  foreground: "#eaeaea"
  accent: "#e94560"
  muted: "#6c6c8a"
  border: "#3a3a5c"
  panel: "#2b2b4a"
  panelSoft: "#23233c"
  panelAlt: "#1f1f36"
  onAccent: "#FFFFFF"
  series:
    - "#4e79a7"
    - "#f28e2b"
    - "#e15759"
    - "#76b7b2"
    - "#59a14f"

typography:
  sans: "Helvetica Neue, Arial, sans-serif"
  mono: "JetBrains Mono, monospace"
  slide:
    title_px: 44
    heading_px: 32
    body_px: 22
    caption_px: 16
  plot:
    base_pt: 18
    title_pt: 22
    tick_pt: 16
    legend_pt: 16
  mermaid:
    font_px: 20

layout:
  figure_width_frac: 0.90
  content_padding_px: 48
  pad_inches: 0.08

space:
  xs: 8
  sm: 12
  md: 16
  lg: 24
  xl: 32
  contentPad: 42
  cardGap: 20
  minCardH: 120
  titleBand: 100
  footerBand: 48
  minFont: 12
  maxFont: 18
  maxCols: 4

branding:
  footer: "Slides CC BY-SA 4.0 · Code MIT"
  # classification: Confidential   # center footer badge (Confidential / Internal Only / …)
  # classification_tone: warn      # warn | muted | accent
  # Optional custom mark (SVG/PNG/JPEG). Paths resolve from theme dir,
  # assets/brand/, or repo root. Omit to use the generated ppt-gen mark.
  # logo: my-logo.svg
  # logo: false          # hide logo
  logo_height_px: 44
  logo_width_px: 44
  logo_top_px: 28
  logo_right_px: 36

plot:
  dpi: 160
  linewidth: 2.0
  markersize: 6
  grid_alpha: 0.25
  margins:
    left: 0.22
    right: 0.94
    top: 0.82
    bottom: 0.20

table:
  header_bg: "{colors.series.0}"
  zebra_bg: "{colors.border}"
  font_px: 18

mermaid:
  theme: base
  dark_mode: true

slots:
  full:
    width_frac: 0.90
    height_frac: 0.58
  half:
    width_frac: 0.44
    height_frac: 0.48
  square:
    width_frac: 0.42
    height_frac: 0.42
