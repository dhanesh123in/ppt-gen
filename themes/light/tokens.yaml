name: light
variant: light

canvas:
  aspect: "16:9"
  width_px: 1280
  height_px: 720

colors:
  background: "#F7F8FA"
  foreground: "#131722"
  accent: "#C45C26"
  muted: "#5C6470"
  border: "#C8CED6"
  panel: "#E9EDF1"
  panelSoft: "#F3F5F7"
  panelAlt: "#FFFFFF"
  onAccent: "#FFFFFF"
  series:
    - "#3D8DFF"
    - "#C45C26"
    - "#E15759"
    - "#6DCBF4"
    - "#59a14f"

typography:
  sans: "Helvetica Neue, Arial, sans-serif"
  mono: "JetBrains Mono, monospace"
  slide:
    title_px: 48
    heading_px: 30
    body_px: 18
    caption_px: 14
  plot:
    base_pt: 18
    title_pt: 22
    tick_pt: 16
    legend_pt: 16
  mermaid:
    font_px: 18

layout:
  figure_width_frac: 0.90
  content_padding_px: 48
  pad_inches: 0.08

space:
  xs: 8
  sm: 12
  md: 16
  lg: 24
  xl: 32
  contentPad: 42
  cardGap: 24
  minCardH: 140
  titleBand: 100
  footerBand: 48
  minFont: 12
  maxFont: 18
  maxCols: 4

branding:
  footer: "Slides CC BY-SA 4.0 · Code MIT"
  # logo: my-logo.svg   # or assets/brand/acme.png; false to hide
  logo_height_px: 44
  logo_width_px: 44
  logo_top_px: 28
  logo_right_px: 36

plot:
  dpi: 160
  linewidth: 2.0
  markersize: 6
  grid_alpha: 0.2
  margins:
    left: 0.22
    right: 0.94
    top: 0.82
    bottom: 0.20

table:
  header_bg: "{colors.series.0}"
  zebra_bg: "{colors.border}"
  font_px: 18

mermaid:
  theme: base
  dark_mode: false

slots:
  full:
    width_frac: 0.90
    height_frac: 0.58
  half:
    width_frac: 0.44
    height_frac: 0.48
  square:
    width_frac: 0.42
    height_frac: 0.42
